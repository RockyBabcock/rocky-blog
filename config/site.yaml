# =============================================================================
# Default Cover List
# 默认封面列表 - 文章没有指定封面时将随机从列表中选择一张作为封面
# 不设置则使用内置的 21 张默认封面 (/img/cover/1~21.webp)
# =============================================================================
# defaultCoverList:
#   - /img/cover/1.webp
#   - https://example.com/custom-cover.webp


# =============================================================================
# Content Processing Options
# 内容处理选项 - 控制文章渲染和交互行为
# =============================================================================
# 字段说明：
#   addBlankTarget: 外部链接在新窗口打开
#   smoothScroll: 启用平滑滚动动画
#   addHeadingLevel: 自动为标题添加层级锚点
#   enhanceCodeBlock: 增强代码块样式（行号、语言标签等）
#   enableCodeCopy: 显示代码块复制按钮
#   enableCodeFullscreen: 显示代码块全屏按钮
#   enableLinkEmbed: 启用链接卡片预览（解析 OG 信息）
#   enableTweetEmbed: 启用推文嵌入展示
#   enableOGPreview: 启用 Open Graph 预览卡片
#   previewCacheTime: 预览信息缓存时间（天）
#   lazyLoadEmbeds: 延迟加载嵌入内容（提升性能）
#   postCardImagePosition: 文章卡片封面图位置 (alternating/left/right)
# -----------------------------------------------------------------------------
content:
  addBlankTarget: true # 外部链接新窗口打开
  smoothScroll: true # 平滑滚动
  addHeadingLevel: true # 标题锚点
  enhanceCodeBlock: true # 增强代码块
  enableCodeCopy: true # 代码复制按钮
  enableCodeFullscreen: true # 代码全屏按钮
  enableLinkEmbed: true # 链接卡片预览
  enableCodePenEmbed: true # CodePen 嵌入
  enableTweetEmbed: true # 推文嵌入
  enableOGPreview: true # OG 预览卡片
  previewCacheTime: 30 # 预览缓存时间(天)
  lazyLoadEmbeds: true # 延迟加载嵌入
  postCardImagePosition: alternating # 文章卡片封面图位置在首页的显示控制 alternating 默认交替显示 left 封面图始终在左侧 right 封面图始终在右侧
  # Shoka 兼容功能（默认全部启用，设为 false 可关闭）
  enableShokaContainers: true   # :::提醒块 ;;;标签卡 +++折叠块
  enableShokaAttrs: true        # [text]{.class} 属性语法
  enableShokaEffects: true      # ++下划线++ ==高亮== ~下标~ ^上标^
  enableShokaSpoiler: true      # !!隐藏文字!!
  enableShokaRuby: true         # {文字^注音} 注音标注
  enableShokaHexoTags: true     # {% media %} Hexo 媒体标签
  enableMath: true              # $数学公式$ KaTeX渲染
  enableCodeMeta: true          # 代码块增强 (title, mark, command)
  enableQuiz: true              # 练习题交互功能
  enableEncryptedBlock: true    # :::encrypted{password="..."} 加密内容块

# =============================================================================
# Motion
# 动效配置 - 站点默认动效强度与樱花特效
# =============================================================================
# 字段说明：
#   level: 访客未手动选择时的默认动效强度，访客可在右下角「设置 → 通用 → 动效强度」中覆盖
#     lively  灵动：页面入场编排、滚动浮现（含正文）、共享元素过渡、樱花特效
#     subtle  克制：保留入场与过渡，正文不做滚动浮现，不播放樱花特效
#     reduced 减弱：关闭装饰性动效，只保留必要的交互反馈
#   heroPetals: 头图樱花飘落（仅 lively 档生效）
#   clickBurst: 点击按钮、链接等可交互元素时迸出花瓣（仅 lively 档生效）
# 系统开启「减少动态效果」(prefers-reduced-motion) 时，始终按 reduced 处理
# -----------------------------------------------------------------------------
motion:
  level: lively
  heroPetals: true
  clickBurst: true

# =============================================================================
# Colophon (落款)
# 文章落款 - 为文章标注创作方式、阅读提示等，字典在这里定义，文章 frontmatter 引用
# =============================================================================
# 用法（文章 frontmatter）：
#   colophon: [ai-cowrite, spoiler]
#   colophon:
#     - ai-cowrite
#     - { id: spoiler, note: 含《我推的孩子》第二季剧透 }   # note：本篇自己的补充说明
#     - { icon: fa6-solid:cat, label: 猫猫审阅过 }          # 一次性标记，不进字典
# 字段说明：
#   groups.<id>.label: 分组名称（显示在文末落款）
#   groups.<id>.exclusive: 是否互斥，互斥组一篇文章只能选一个（默认 false）
#   groups.<id>.placement / marks.<id>.placement: 显示位置，可多选（标记优先，其次分组，默认 [meta, seal]）
#     meta   封面信息行（字数、阅读时长旁）
#     banner 正文前的提示条
#     seal   文末落款
#     card   文章列表卡片上的小图标
#   marks.<id>.icon: Iconify 图标，限 ri / fa6-solid / fa6-regular / gg 四套（见 src/lib/config/icon-sets.ts）
#   marks.<id>.tone: muted（默认）| accent | warn
#   defaults: 默认标记，文章没有该组的标记时自动补上（每组最多一个）；文章写 colophon: [] 可不显示任何标记
# 多语言：在 config/i18n-content.yaml 的 <locale>.colophon 下覆盖 groups / marks 文案
# 删除整个 colophon 段落即可关闭此功能
# -----------------------------------------------------------------------------
colophon:
  enabled: true
  defaults: [handwritten] # 没写执笔的文章默认显示「手写」
  groups:
    authorship:
      label: 执笔
      exclusive: true
      placement: [meta, seal, card]
    notice:
      label: 阅读提示
      placement: [meta, banner]
    # ai:
    #   label: AI 参与
    #   placement: [seal]
    # art:
    #   label: 图像
    #   placement: [seal]
    # status:
    #   label: 文章状态
    #   placement: [meta, seal]
    # mood:
    #   label: 写作时
    #   placement: [seal]
  marks:
    handwritten:
      group: authorship
      icon: ri:quill-pen-line
      label: 手写
      description: 每个字都是我自己敲的。
    ai-cowrite:
      group: authorship
      icon: ri:sparkling-2-line
      label: 与 AI 合写
      description: 我主笔，AI 帮我理思路、换说法。
    ai-lead:
      group: authorship
      icon: ri:sparkling-2-fill
      label: AI 主笔
      description: 正文主要由 AI 起草，我负责挑选和改写。
    spoiler:
      group: notice
      icon: ri:eye-off-line
      label: 含剧透
      description: 涉及作品后续剧情，还没看完的话可以先收藏。
      tone: warn
    outdated:
      group: notice
      icon: ri:hourglass-line
      label: 可能已过时
      description: 写得比较早，文中的版本和做法可能已经变了。
      tone: warn
    # ai-idea: { group: ai, icon: ri:lightbulb-flash-line, label: 构思, description: 和 AI 聊过选题与结构。 }
    # ai-polish: { group: ai, icon: ri:magic-line, label: 润色, description: AI 帮忙改过措辞和错字。 }
    # ai-code: { group: ai, icon: ri:code-s-slash-line, label: 代码, description: 示例代码有 AI 参与编写。 }
    # ai-translate: { group: ai, icon: ri:translate-2, label: 翻译, description: 译文由 AI 初译，我校对过。 }
    # self-drawn: { group: art, icon: ri:brush-line, label: 自己画的, description: 文中插图是我自己画的。 }
    # photo: { group: art, icon: ri:camera-3-line, label: 自己拍的, description: 照片都是我自己拍的。 }
    # ai-art: { group: art, icon: ri:image-ai-line, label: AI 配图, description: 文中有 AI 生成或协作绘制的图。 }
    # ongoing: { group: status, icon: ri:refresh-line, label: 持续更新, description: 这篇会不定期补充。 }
    # wip: { group: status, icon: ri:seedling-line, label: 未完待续, description: 坑还没填完，后面会接着写。 }
    # late-night: { group: mood, icon: ri:moon-clear-line, label: 深夜写的 }
    # one-sitting: { group: mood, icon: ri:cup-line, label: 一口气写完 }

# =============================================================================
# Post Actions
# 文章操作 - 面包屑右侧的「复制 Markdown」按钮组
# =============================================================================
# 字段说明：
#   copyMarkdown: 复制全文 Markdown（含 frontmatter）
#   downloadMarkdown: 下载 .md 文件
# 加密文章（password）不提供原文，也不显示这些按钮
# -----------------------------------------------------------------------------
postActions:
  copyMarkdown: true
  downloadMarkdown: true

# =============================================================================
# Navigation Routes
# 导航菜单配置 - 定义顶部导航栏的菜单项
# =============================================================================
# 字段说明：
#   name: 菜单项显示名称
#   path: 链接路径（有 children 时可省略，点击展开子菜单）
#   icon: Iconify 图标标识，格式 "集合:图标名"
#   children: (可选) 子菜单列表，结构与父级相同
# -----------------------------------------------------------------------------
# 图标参考：
#   - Font Awesome 6: https://icon-sets.iconify.design/fa6-solid/
#   - Remix Icon: https://icon-sets.iconify.design/ri/
# -----------------------------------------------------------------------------
navigation:
  - name: 首页 # 菜单显示名称（nameKey 不存在时的回退文本）
    nameKey: nav.home # i18n 翻译 key
    path: / # 链接路径
    icon: ri:home-heart-fill # 图标
  # - name: 书摘
  #   path: /reading
  - name: 周刊
    nameKey: nav.weekly
    path: /weekly
    icon: ri:newspaper-line
  - name: 文章 # 有子菜单时，path 可省略
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children: # 子菜单列表
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
